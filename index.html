<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wybór panelu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            gap: 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .btn-klient {
            background-color: #007bff;
        }
        .btn-klient:hover {
            background-color: #0056b3;
        }
        .btn-kasjer {
            background-color: #28a745;
        }
        .btn-kasjer:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wybierz panel logowania</h1>
        <div class="btn-container">
            <a href="klient.html" class="btn btn-klient">Panel Klienta</a>
            <a href="kasjer.html" class="btn btn-kasjer">Panel Kasjera</a>
        </div>
    </div>

</body>
</html>
