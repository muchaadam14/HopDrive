<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hop Drive - Panel Kasjera</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #212121; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 2px solid #fcd034; padding-bottom: 10px; margin-bottom: 20px; color: #fcd034; }
        .order-card { background: #333; border-left: 5px solid #872ba1; padding: 15px; margin-bottom: 15px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; color: #fcd034; padding-right: 110px; }
        .order-info { margin: 5px 0; font-size: 15px; }
        .products { background: #444; padding: 10px; border-radius: 4px; margin-top: 10px; white-space: pre-wrap; border: 1px solid #555; }
        .no-orders { text-align: center; color: #888; margin-top: 40px; font-style: italic; }
        .done-btn { position: absolute; top: 12px; right: 15px; background: #2e7d32; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .done-btn:hover { background: #1b5e20; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wpadające Zamówienia (Na Żywo Online)</h1>
        <div id="ordersList">
            <div class="no-orders" id="noOrdersMessage">Oczekiwanie na pierwsze zamówienia...</div>
        </div>
    </div>

    <script>
        const list = document.getElementById('ordersList');
        
        // Stabilny, bezpieczny odbiornik typu Server-Sent Events, odporny na filtry CORS
        const eventSource = new EventSource('https://ntfy.sh');

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (!data.message) return;

            // Sprawdzamy czy to poprawny ciąg danych zamówienia
            const rawText = data.message;
            if (!rawText.includes("Klient=") && !rawText.includes("Produkty=")) return;

            const noOrders = document.getElementById('noOrdersMessage');
            if (noOrders) noOrders.remove();

            const cardId = `order-${data.id}`;
            if (document.getElementById(cardId)) return;

            // Parsowanie danych z rozdzielonych linii formularza
            const lines = rawText.split('\n');
            let name = "Nieznany", phone = "Brak", shop = "Nie wybrano", products = "";
            let collectingProducts = false;

            lines.forEach(line => {
                if (line.startsWith("Klient=")) name = line.replace("Klient=", "").trim();
                if (line.startsWith("Telefon=")) phone = line.replace("Telefon=", "").trim();
                if (line.startsWith("Sklep=")) shop = line.replace("Sklep=", "").trim();
                if (line.startsWith("Produkty=")) {
                    products = line.replace("Produkty=", "").trim();
                    collectingProducts = true;
                } else if (collectingProducts) {
                    products += "\n" + line;
                }
            });

            const timeString = new Date(data.time * 1000).toLocaleTimeString();

            const card = document.createElement('div');
            card.className = 'order-card';
            card.id = cardId;
            card.innerHTML = `
                <div class="order-header">
                    <span>👤 ${name}</span>
                    <span>⏰ ${timeString}</span>
                </div>
                <div class="order-info"><strong>📞 Telefon:</strong> ${phone}</div>
                <div class="order-info"><strong>🏪 Sklep docelowy:</strong> ${shop}</div>
                <div class="products"><strong>🛒 Lista zakupów:</strong>\n${products}</div>
                <button class="done-btn" onclick="removeOrder('${data.id}')">Zrobione ✓</button>
            `;

            list.insertBefore(card, list.firstChild);

            // Uruchomienie dzwonka powiadomienia
            try { new Audio('https://google.com').play(); } catch(e){}
        };

        function removeOrder(orderId) {
            const el = document.getElementById(`order-${orderId}`);
            if (el) el.remove();

            if (list.children.length === 0) {
                list.innerHTML = '<div class="no-orders" id="noOrdersMessage">Oczekiwanie na pierwsze zamówienia...</div>';
            }
        }
    </script>
</body>
</html>
