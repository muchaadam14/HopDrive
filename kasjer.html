<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hop Drive - Panel Kasjera</title>
    <!-- Skrypty Firebase dla odbierania danych na żywo bez przeładowania -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #212121; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 2px solid #fcd034; padding-bottom: 10px; margin-bottom: 20px; color: #fcd034; }
        .order-card { background: #333; border-left: 5px solid #872ba1; padding: 15px; margin-bottom: 15px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; color: #fcd034; padding-right: 110px; }
        .order-info { margin: 5px 0; font-size: 15px; }
        .products { background: #444; padding: 10px; border-radius: 4px; margin-top: 10px; white-space: pre-wrap; border: 1px solid #555; }
        .no-orders { text-align: center; color: #888; margin-top: 40px; font-style: italic; }
        .done-btn { position: absolute; top: 12px; right: 15px; background: #2e7d32; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .done-btn:hover { background: #1b5e20; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wpadające Zamówienia (Na Żywo Online)</h1>
        <div id="ordersList">
            <div class="no-orders" id="noOrdersMessage">Oczekiwanie na pierwsze zamówienia...</div>
        </div>
    </div>

    <script>
        // Konfiguracja połączenia z tą samą bazą danych online
        const firebaseConfig = {
            databaseURL: "https://firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const list = document.getElementById('ordersList');

        // Funkcja nasłuchująca bazę danych w czasie rzeczywistym
        database.ref('orders').on('child_added', (snapshot) => {
            const orderKey = snapshot.key;
            const order = snapshot.val();

            const noOrders = document.getElementById('noOrdersMessage');
            if (noOrders) noOrders.remove();

            // Tworzymy czytelną kartę z idealnie rozdzielonymi polami u kasjera
            const card = document.createElement('div');
            card.className = 'order-card';
            card.id = `order-${orderKey}`;
            card.innerHTML = `
                <div class="order-header">
                    <span>👤 ${order.name}</span>
                    <span>⏰ ${order.time}</span>
                </div>
                <div class="order-info"><strong>📞 Telefon:</strong> ${order.phone}</div>
                <div class="order-info"><strong>🏪 Sklep docelowy:</strong> ${order.shop}</div>
                <div class="products"><strong>🛒 Lista zakupów:</strong>\n${order.products}</div>
                <button class="done-btn" onclick="removeOrder('${orderKey}')">Zrobione ✓</button>
            `;

            // Najnowsze zamówienia lądują zawsze na samej górze panelu
            list.insertBefore(card, list.firstChild);

            // Dźwięk powiadomienia o nowym zamówieniu
            try { new Audio('https://google.com').play(); } catch(e){}
        });

        // Usuwanie zrealizowanego zamówienia z bazy danych
        function removeOrder(orderKey) {
            database.ref('orders/' + orderKey).remove()
            .then(() => {
                const el = document.getElementById(`order-${orderKey}`);
                if (el) el.remove();

                if (list.children.length === 0) {
                    list.innerHTML = '<div class="no-orders" id="noOrdersMessage">Oczekiwanie na pierwsze zamówienia...</div>';
                }
            })
            .catch(err => alert("Błąd podczas usuwania: " + err));
        }
    </script>
</body>
</html>
